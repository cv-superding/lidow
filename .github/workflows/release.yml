name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # 构建矩阵：只产构建物（artifact），不在任务内发 Release，避免双草稿拆分
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # --publish never：tag 构建时 electron-builder 默认会自动上传，缺 GH_TOKEN 会直接失败；
      # 发布统一交给下面的 release job（softprops/action-gh-release）。
      - name: Build Windows (installer + portable)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win nsis portable --config electron-builder.yml --publish never
      - name: Build macOS (universal dmg + zip)
        if: matrix.os == 'macos-latest'
        # macos-latest 是 arm64 runner；--universal 同时打 x64 + arm64，
        # 避免 Intel Mac 下载到只能跑 Apple Silicon 的包。
        run: npx electron-builder --mac --universal --config electron-builder.yml --publish never
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  # 单一发布任务：合并全部平台产物并直接发布（electron-updater 不读取 draft）
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
