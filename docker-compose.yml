services:
  lidow:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
    image: lidow:local
    container_name: lidow
    restart: unless-stopped
    stop_grace_period: 15s
    shm_size: "1gb"
    ports:
      # 默认只监听本机；远程访问请设置 LIDOW_BIND_ADDR=0.0.0.0 并配置 LIDOW_WEB_TOKEN
      - "${LIDOW_BIND_ADDR:-127.0.0.1}:${LIDOW_WEB_PORT:-6080}:6080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      LIDOW_SCREEN: ${LIDOW_SCREEN:-1360x860x24}
      LIDOW_WEB_TOKEN: ${LIDOW_WEB_TOKEN:-}
      LIDOW_ENABLE_GPU: ${LIDOW_ENABLE_GPU:-0}
    volumes:
      # 应用设置、日志、记忆、插件配置
      - lidow-config:/home/lidow/.config/Lidow
      # 用户级 skills / agents / rules
      - lidow-user:/home/lidow/.lidow
      # 项目工作区：容器内的 /workspace，挂到宿主机 ./workspace
      - ./workspace:/workspace
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:6080/healthz >/dev/null && pgrep -f '^/opt/lidow/' >/dev/null"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  lidow-config:
  lidow-user:
