appId: ai.lidow.app
productName: Lidow
copyright: Copyright © 2026 Lidow Contributors

directories:
  buildResources: build
  output: dist

# 修复上游 #45：显式只打包构建产物，排除中间文件导致的启动失败
files:
  - out/**
  - package.json
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/*.d.ts"
  - "!**/node_modules/.bin"
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
  - "!.editorconfig"
  - "!**/._*"
  - "!**/{.git,.hg,.svn,CVS,RCS,SCCS,__pycache__,.DS_Store,Thumbs.db,.gitignore,.gitkeep,.gitattributes,.editorconfig,.flowconfig,.jshintrc,.eslintrc}"

asar: true

# 项目模板是运行时资源（resources/templates），不能被 asar/files 白名单漏掉
extraResources:
  - from: templates
    to: templates
  - from: build/icon.png
    to: icon.png
  - from: build/icon.ico
    to: icon.ico
  - from: out/web
    to: web

win:
  target:
    - nsis
    - portable
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  # 文件名不能带空格：electron-updater 按 latest.yml 里的连字符名去 Releases 找文件
  artifactName: ${productName}-Setup-${version}.${ext}

portable:
  artifactName: ${productName}-${version}-portable.${ext}

mac:
  # zip 是 electron-updater 在 macOS 上唯一支持的更新包格式（dmg 只用于首次安装）
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  icon: build/icon.png
  artifactName: ${productName}-${version}.${ext}

linux:
  target:
    - dir
  category: Development
  icon: build/icon.png

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

publish:
  provider: github
  owner: cv-superding
  repo: lidow
